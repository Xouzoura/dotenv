keybindings:
  back: q
  move_up: k
  move_down: j
  move_left: h
  move_right: l
  next_page: ctrl-d
  previous_page: ctrl-u
  jump_to_start: g          # ncspot: g = move up 1000
  jump_to_end: G            # ncspot: Shift+g = move down 1000
  jump_to_album: a
  jump_to_artist_album: A
  jump_to_context: o
  manage_devices: d
  decrease_volume: '['
  increase_volume: ']'
  toggle_playback: space
  seek_backwards: <
  seek_forwards: '>'
  next_track: L             # ncspot: Shift+l
  previous_track: H         # ncspot: Shift+h
  force_previous_track: P
  help: '?'
  shuffle: ctrl-s
  repeat: ctrl-r
  search: /
  submit: enter
  copy_song_url: y          # ncspot: y = share
  copy_album_url: Y         # ncspot: Shift+y
  audio_analysis: v
  lyrics_view: B
  miniplayer_view: T
  cover_art_view: c         # moved off G (now jump_to_end)
  add_item_to_queue: ctrl-t      # ncspot: Shift+w = add selected
  show_queue: f1
  remove_from_queue: x
  open_settings: alt-,
  save_settings: alt-s
  listening_party: ctrl-p
  like_track: F
  generate_recap: R
behavior:
  seek_milliseconds: 5000
  volume_increment: 10
  tick_rate_milliseconds: 250
  animation_tick_rate_milliseconds: 16
  enable_text_emphasis: true
  banner_gradient: true
  show_loading_indicator: true
  enforce_wide_search_bar: false
  group_folders_first: false
  enable_global_song_count: false
  disable_mouse_inputs: false
  enable_discord_rpc: true
  discord_rpc_client_id: null
  enable_announcements: true
  enable_lyrics: true
  announcement_feed_url: null
  enable_monthly_recap_prompt: true
  pin_community_playlist: true
  liked_icon: ♥
  shuffle_icon: 🔀
  repeat_track_icon: 🔂
  repeat_context_icon: 🔁
  playing_icon: ▶
  paused_icon: ⏸
  set_window_title: true
  visualizer_style: Cava
  relay_server_url: wss://spotatui-party.spotatui.workers.dev/ws
  stop_after_current_track: false
  startup_behavior: continue
  disable_auto_update: false
  auto_update_delay: '0'
  keepawake_enabled: true
  enable_media_keys: true
  enable_streaming: true
  streaming_device_name: spotatui
  streaming_bitrate: 320
  streaming_audio_cache: false
  streaming_autoplay: true
  sync_token: null
  local_music_path: /home/xouzoura/Music
  subsonic_url: null
  subsonic_username: null
  subsonic_password: null
  ytdlp_path: null
  qobuz_quality: 6
  gauge_filled_icon: ⣿
  gauge_unfilled_icon: ⣉
  active_source_icon: ●
  episode_played_icon: ✔
  sort_ascending_icon: ↑
  sort_descending_icon: ↓
  list_highlight_icon: ▶
  playbar_control_labels: null
  status_message_ttl_percent: 100
  playback_poll_seconds: 5
  table_scroll_padding: 5
  like_animation_frames: 10
  startup_route: home
  default_sort_playlist_tracks: default
  default_sort_saved_albums: default
  default_sort_saved_artists: default
  default_sort_recently_played: default
  sidebar_position: left
  playbar_position: bottom
  small_terminal_width: 150
  small_terminal_height: 45
theme:
  preset: Default (Cyan)
  active: 0, 180, 180
  banner: 0, 200, 200
  error_border: 200, 0, 0
  error_text: 255, 100, 100
  hint: 200, 200, 0
  hovered: 180, 0, 180
  inactive: 128, 128, 128
  playbar_background: Reset
  playbar_progress: 0, 200, 200
  playbar_progress_text: 255, 255, 255
  playbar_text: Reset
  selected: 0, 200, 200
  text: Reset
  background: Reset
  header: Reset
  highlighted_lyrics: 0, 200, 200
plugin_commands: null
format: null
tables: null
